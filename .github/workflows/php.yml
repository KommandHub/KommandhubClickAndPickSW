name: Shopware Plugin CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

permissions:
  contents: read

jobs:
  quality:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, gd, zip
          coverage: pcov

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}

      # --no-security-blocking: the plugin resolves shopware/core fresh (no lock
      # in the repo), and current 6.7.x pulls transitive deps (dompdf, mcp/sdk)
      # carrying upstream security advisories we do not control. The flag lets the
      # CI test install proceed; it only applies when no lock file is present.
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-security-blocking

      # Lint PHP (fast fail)
      - name: Lint PHP files
        run: find src -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      # Static analysis
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse src -c phpstan.dist.neon --no-progress

      # Code style
      - name: Run PHP CS Fixer
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff

      # Unit + mockable tests (no Shopware kernel). Kernel/integration tests live
      # under tests/Integration and are excluded from the no-kernel CI run.
      - name: Run PHPUnit
        run: CI=true ./vendor/bin/phpunit --testsuite Unit --testdox
