# .gitlab-ci.yml
image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  PLUGIN_NAME: "KommandhubClickAndPickSW"
  CONTAINER_NAME: "shopware-test-${CI_PIPELINE_ID}"
  COMPOSE_PROJECT_NAME: "shopware-${CI_PIPELINE_ID}"

stages:
  - test
  - quality
  - security
  - build

before_script:
  - apk add --no-cache docker-compose bash curl git mysql-client
  - docker --version
  - docker-compose --version

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - vendor/
    - .phpunit.cache/
  policy: pull-push

# Test in Dockware container
.test-template: &test-template
  before_script:
    - |
      cat > docker-compose.ci.yml << 'EOF'
      version: '3.8'

      services:
        shopware:
          image: dockware/dev:6.7.2.2
          container_name: ${CONTAINER_NAME}
          environment:
            - PHP_VERSION=8.1
            - COMPOSER_VERSION=2
            - DATABASE_URL=mysql://root:root@mysql:3306/shopware
          ports:
            - "80"
          volumes:
            - ./:/var/www/html
          depends_on:
            - mysql
          working_dir: /var/www/html
          command: >
            sh -c "
            apt-get update &&
            apt-get install -y php-dev php-pear mysql-client &&
            pecl install pcov &&
            echo 'extension=pcov.so' > /etc/php/8.1/cli/conf.d/20-pcov.ini &&
            echo 'pcov.enabled=1' >> /etc/php/8.1/cli/conf.d/20-pcov.ini &&
            apt-get install -y make &&
            chown -R www-data:www-data /var/www/html &&
            /bin/bash /opt/dockware/start.sh
            "

        mysql:
          image: mysql:8.0
          container_name: mysql-${CONTAINER_NAME}
          environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: shopware
          command: --default-authentication-plugin=mysql_native_password
      EOF
    - docker-compose -f docker-compose.ci.yml up -d
    - |
      echo "Waiting for services to be ready..."
      # Wait for MySQL
      until docker-compose -f docker-compose.ci.yml exec -T mysql mysql -uroot -proot -e "SELECT 1;" > /dev/null 2>&1; do
        echo "Waiting for MySQL..."
        sleep 5
      done
      # Wait for Shopware
      until docker-compose -f docker-compose.ci.yml exec -T shopware curl -f http://localhost > /dev/null 2>&1; do
        echo "Waiting for Shopware..."
        sleep 10
      done
    - docker-compose -f docker-compose.ci.yml exec -T shopware mysql -h mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS shopware_test;"
    - docker-compose -f docker-compose.ci.yml exec -T shopware composer install --prefer-dist --no-progress --no-interaction
  after_script:
    - docker-compose -f docker-compose.ci.yml down -v

# Unit Tests
unit-tests:
  stage: test
  <<: *test-template
  script:
    - |
      docker-compose -f docker-compose.ci.yml exec -T shopware bash -c "
        cd custom/plugins/KommandhubClickAndPickSW &&
        ./vendor/bin/phpunit \
          --testdox \
          --configuration='.' \
          --colors=always
      "
  artifacts:
    when: always
    paths:
      - build/logs/
    reports:
      junit: build/logs/junit.xml
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop

# Unit Tests with Coverage
unit-tests-coverage:
  stage: test
  <<: *test-template
  script:
    - |
      docker-compose -f docker-compose.ci.yml exec -T shopware bash -c "
        cd custom/plugins/KommandhubClickAndPickSW &&
        ./vendor/bin/phpunit \
          --testdox \
          --coverage-html build/coverage \
          --coverage-text \
          --configuration='.' \
          --coverage-clover build/logs/clover.xml \
          --colors=always
      "
    - |
      # Install and run coverage check
      docker-compose -f docker-compose.ci.yml exec -T shopware bash -c "
        cd custom/plugins/KommandhubClickAndPickSW &&
        composer require --dev rregeer/phpunit-coverage-check --no-interaction &&
        ./vendor/bin/coverage-check build/logs/clover.xml --ansi
      "
  coverage: '/^\s*Lines:\s*\d+\.\d+\%/'
  artifacts:
    paths:
      - build/coverage/
      - build/logs/clover.xml
    reports:

    expire_in: 1 week
  only:
    - merge_requests
    - main

# Code Quality
code-quality:
  stage: quality
  <<: *test-template
  script:
    - |
      docker-compose -f docker-compose.ci.yml exec -T shopware bash -c "
        cd custom/plugins/KommandhubClickAndPickSW &&
        # Install PHP-CS-Fixer if not exists
        if [ ! -f ./vendor/bin/php-cs-fixer ]; then
          composer require --dev friendsofphp/php-cs-fixer --no-interaction
        fi &&
        ./vendor/bin/php-cs-fixer fix --dry-run --diff
      "
    - |
      docker-compose -f docker-compose.ci.yml exec -T shopware bash -c "
        cd custom/plugins/KommandhubClickAndPickSW &&
        # Install PHPStan if not exists
        if [ ! -f ./vendor/bin/phpstan ]; then
          composer require --dev phpstan/phpstan --no-interaction
        fi &&
        ./vendor/bin/phpstan analyse src --memory-limit=1G
      "
  artifacts:
    paths:
      - build/logs/
    expire_in: 1 week
  only:
    - merge_requests
    - main

# Security Check
security-check:
  stage: security
  <<: *test-template
  script:
    - |
      docker-compose -f docker-compose.ci.yml exec -T shopware bash -c "
        cd custom/plugins/KommandhubClickAndPickSW &&
        composer require --dev enlightn/security-checker --no-interaction &&
        ./vendor/bin/security-checker security:check
      "
  only:
    - main
    - schedules

# Build Package
build-package:
  stage: build
  <<: *test-template
  script:
    - |
      docker-compose -f docker-compose.ci.yml exec -T shopware bash -c "
        cd custom/plugins/KommandhubClickAndPickSW &&
        composer install --no-dev --optimize-autoloader &&
        mkdir -p build/package &&
        zip -r build/package/${PLUGIN_NAME}-${CI_COMMIT_TAG:-${CI_COMMIT_SHA}}.zip . \
          -x '*.git*' \
          '*.gitlab-ci.yml' \
          'tests/*' \
          'build/coverage/*' \
          '*.dist' \
          '*.md' \
          'composer.json' \
          'composer.lock' \
          'phpunit.xml*' \
          'Makefile' \
          'docker-compose*'
      "
    - |
      # Copy the built package from the container
      docker cp ${CONTAINER_NAME}:/var/www/html/custom/plugins/KommandhubClickAndPickSW/build/package/ build/
  artifacts:
    paths:
      - build/package/
    expire_in: 1 month
  only:
    - tags

# Full Test Suite (Manual)
full-test-suite:
  stage: test
  <<: *test-template
  script:
    - |
      docker-compose -f docker-compose.ci.yml exec -T shopware bash -c "
        cd custom/plugins/KommandhubClickAndPickSW &&
        # Run tests
        ./vendor/bin/phpunit --testdox --configuration='.' --colors=always &&
        # Run coverage
        ./vendor/bin/phpunit --coverage-text --configuration='.' &&
        # Code style
        if [ -f ./vendor/bin/php-cs-fixer ]; then
          ./vendor/bin/php-cs-fixer fix --dry-run --diff
        fi &&
        # Static analysis
        if [ -f ./vendor/bin/phpstan ]; then
          ./vendor/bin/phpstan analyse src --memory-limit=1G
        fi
      "
  when: manual
  allow_failure: false
  artifacts:
    paths:
      - build/coverage/
      - build/logs/
    expire_in: 1 week

# Quick Test (Fast feedback)
quick-test:
  stage: test
  <<: *test-template
  script:
    - |
      docker-compose -f docker-compose.ci.yml exec -T shopware bash -c "
        cd custom/plugins/KommandhubClickAndPickSW &&
        ./vendor/bin/phpunit --testdox --configuration='.' --colors=always
      "
  artifacts:
    paths:
      - build/logs/junit.xml
    reports:
      junit: build/logs/junit.xml
  only:
    - merge_requests

# Coverage Report Pages (GitLab Pages)
pages:
  stage: build
  dependencies:
    - unit-tests-coverage
  script:
    - |
      # Copy coverage HTML to public directory for GitLab Pages
      docker cp ${CONTAINER_NAME}:/var/www/html/custom/plugins/KommandhubClickAndPickSW/build/coverage/ public/
    - |
      # Create index.html for Pages
      cat > public/index.html << 'EOF'
      <!DOCTYPE html>
      <html>
      <head>
          <title>Test Coverage Report - ${PLUGIN_NAME}</title>
          <meta charset="UTF-8">
          <style>
              body { font-family: Arial, sans-serif; margin: 40px; }
              h1 { color: #333; }
              .info { background: #f5f5f5; padding: 15px; border-radius: 5px; }
          </style>
      </head>
      <body>
          <h1>Test Coverage Report</h1>
          <div class="info">
              <p><strong>Plugin:</strong> ${PLUGIN_NAME}</p>
              <p><strong>Pipeline:</strong> ${CI_PIPELINE_ID}</p>
              <p><strong>Commit:</strong> ${CI_COMMIT_SHORT_SHA}</p>
              <p><a href="./index.html">View Coverage Report</a></p>
          </div>
      </body>
      </html>
      EOF
  artifacts:
    paths:
      - public
  only:
    - main

# Database Integration Tests
integration-tests:
  stage: test
  <<: *test-template
  script:
    - |
      docker-compose -f docker-compose.ci.yml exec -T shopware bash -c "
        # Setup Shopware database
        php bin/console database:create &&
        php bin/console database:migrate --all &&
        php bin/console plugin:refresh &&
        php bin/console plugin:install --activate ${PLUGIN_NAME} &&
        php bin/console cache:clear
      "
    - |
      docker-compose -f docker-compose.ci.yml exec -T shopware bash -c "
        cd custom/plugins/KommandhubClickAndPickSW &&
        # Run tests that require database
        ./vendor/bin/phpunit --testdox --configuration='.' --colors=always --testsuite='Project Test Suite'
      "
  artifacts:
    paths:
      - build/logs/
    expire_in: 1 week
  only:
    - merge_requests
    - main